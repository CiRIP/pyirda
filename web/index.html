<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beam a file</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 12px;
        font-family: monospace;
        background: #1a1a1a;
        color: #e0e0e0;
      }

      h3 {
        margin-bottom: 12px;
        color: #fff;
      }

      p {
        margin-bottom: 10px;
        font-size: 14px;
        line-height: 1.5;
        color: #ccc;
      }

      button {
        padding: 6px 14px;
        font: inherit;
        font-size: 13px;
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 3px;
        color: #ccc;
        cursor: pointer;
      }

      button:hover {
        background: #4a4a4a;
      }

      button.primary {
        background: #2d6a2d;
        border-color: #3a8a3a;
        color: #fff;
      }

      button.primary:hover {
        background: #357a35;
      }

      #dropzone {
        width: 390px;
        max-width: 100%;
        padding: 48px 16px;
        text-align: center;
        font-size: 15px;
        color: #999;
        border: 2px dashed #444;
        border-radius: 8px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s,
          background 0.15s;
      }

      #dropzone:hover {
        border-color: #666;
        color: #ccc;
      }

      .dragging #dropzone {
        border-color: #7dff7d;
        color: #7dff7d;
        background: #16241a;
      }

      #dropzone small {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: #666;
      }

      dialog {
        width: 420px;
        max-width: 90vw;
        margin: auto;
        padding: 20px;
        background: #232323;
        border: 1px solid #444;
        border-radius: 8px;
        color: inherit;
      }

      dialog::backdrop {
        background: rgba(0, 0, 0, 0.6);
      }

      ol {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        list-style: none;
        font-size: 11px;
        color: #666;
      }

      li {
        flex: 1;
        padding-bottom: 6px;
        text-align: center;
        border-bottom: 2px solid #3a3a3a;
      }

      li.active {
        color: #7dff7d;
        border-color: #7dff7d;
      }

      #dongle-step p {
        margin-bottom: 16px;
      }

      #searching-step p {
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        50% {
          opacity: 0.4;
        }
      }

      progress {
        width: 100%;
        height: 14px;
        margin: 14px 0 4px;
        appearance: none;
      }

      progress::-webkit-progress-bar {
        background: #111;
        border: 1px solid #333;
        border-radius: 6px;
      }

      progress::-webkit-progress-value {
        background: #3a8a3a;
        border-radius: 6px;
        transition: width 0.25s;
      }

      #error {
        color: #ff8080;
      }

      footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <label id="dropzone">
      Drop a file here
      <small>or click to choose one</small>
      <input type="file" id="picker" hidden />
    </label>

    <dialog id="wizard">
      <ol>
        <li data-step="dongle-step">1. Dongle</li>
        <li data-step="searching-step">2. Search</li>
        <li data-step="sending-step">3. Send</li>
      </ol>

      <section id="dongle-step">
        <h3>Plug in your dongle</h3>
        <p>What kind is it?</p>
        <button id="serial" class="primary">Serial</button>
        <button id="usb" class="primary">USB</button>
      </section>

      <section id="searching-step">
        <h3>Searching</h3>
        <p>Point the other device at the dongle.</p>
      </section>

      <section id="sending-step">
        <h3>Sending</h3>
        <p id="name"></p>
        <progress id="progress"></progress>
      </section>

      <section id="done-step">
        <h3>Sent</h3>
      </section>

      <section id="failed-step">
        <h3>Something went wrong</h3>
        <p id="error"></p>
        <button id="retry" class="primary">Try again</button>
      </section>

      <form method="dialog">
        <footer><button>Close</button></footer>
      </form>
    </dialog>

    <script type="module" src="/send/main.ts"></script>
  </body>
</html>
